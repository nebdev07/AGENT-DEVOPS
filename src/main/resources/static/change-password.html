<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Changer le mot de passe â€” VPS Autopilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0d12; --line: rgba(230,235,242,.1); --text: #e6ebf2; --muted: #8d97a6;
      --accent: #8fcdc0; --accent-ink: #0c1614;
      --font-display: "Sora", system-ui, sans-serif; --font-body: "Figtree", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: var(--font-body); color: var(--text);
      background: radial-gradient(800px 360px at 15% -10%, rgba(143,205,192,.08), transparent 55%), var(--bg);
      display: grid; place-items: center; padding: 1.5rem;
    }
    .card {
      width: min(100%, 30rem); padding: 2rem 1.75rem;
      background: rgba(20,26,34,.92); border: 1px solid var(--line); border-radius: 1.1rem;
    }
    .brand { font-family: var(--font-display); font-weight: 800; color: var(--accent); margin: 0 0 .35rem; }
    h1 { font-family: var(--font-display); font-size: 1.45rem; margin: 0 0 .5rem; }
    .muted { color: var(--muted); margin: 0 0 1.2rem; line-height: 1.5; }
    label { display: block; margin: .7rem 0 .35rem; font-weight: 600; font-size: .9rem; }
    input {
      width: 100%; padding: .7rem .75rem; border-radius: .55rem;
      border: 1px solid var(--line); background: #0c1016; color: var(--text); font: inherit;
    }
    button {
      width: 100%; margin-top: 1.1rem; padding: .75rem 1rem; border: 0; border-radius: .55rem;
      background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer;
    }
    #msg { margin-top: 1rem; } .ok { color: var(--accent); } .err { color: #c98b8b; }
  </style>
</head>
<body>
  <main class="card">
    <p class="brand">VPS Autopilot</p>
    <h1>Nouveau mot de passe</h1>
    <p class="muted">Obligatoire Ã  la premiÃ¨re connexion. Minimum 10 caractÃ¨res.</p>
    <form id="form">
      <label for="current">Mot de passe actuel</label>
      <input id="current" type="password" required autocomplete="current-password"/>
      <label for="next">Nouveau mot de passe</label>
      <input id="next" type="password" required minlength="10" autocomplete="new-password"/>
      <label for="confirm">Confirmer</label>
      <input id="confirm" type="password" required minlength="10" autocomplete="new-password"/>
      <button type="submit">Enregistrer</button>
    </form>
    <p id="msg"></p>
  </main>
  <script>
    const msg = document.getElementById("msg");
    fetch("/api/v1/platform/auth/me", { credentials: "same-origin" }).then(r => {
      if (r.status === 401) location.href = "/login.html";
    });
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const currentPassword = document.getElementById("current").value;
      const newPassword = document.getElementById("next").value;
      const confirm = document.getElementById("confirm").value;
      if (newPassword !== confirm) {
        msg.className = "err"; msg.textContent = "La confirmation ne correspond pas."; return;
      }
      msg.className = ""; msg.textContent = "Enregistrementâ€¦";
      const r = await fetch("/api/v1/platform/auth/password", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ currentPassword, newPassword })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { msg.className = "err"; msg.textContent = j.error || ("Erreur " + r.status); return; }
      msg.className = "ok"; msg.textContent = "Mot de passe mis Ã  jour â€” redirectionâ€¦";
      location.href = "/index.html#cockpit";
    });
  </script>
</body>
</html>
