server.port: 8088
# Console sans authentification : joignable depuis ce poste seulement (ADR-045). SERVER_ADDRESS pour changer.
server.address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  profiles:
    group:
      # Raccourcis : SPRING_PROFILES_ACTIVE=saas-local | saas-manual
      saas-local: saas,local
      saas-manual: saas,manual
  # Base de données, Flyway et comptes Spring Security : profil saas seulement (ADR-048).
  # La console locale, cargo et platform restent sans base (fichiers state/).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  config:
    import: optional:file:./state/agent-local.yml
  servlet:
    multipart:
      max-file-size: 4GB
      max-request-size: 8GB
      file-size-threshold: 1MB

devops:
  state-dir: ./state
  lab-fixture: classpath:fixtures/ubuntu-vps2-blank.txt
  platform:
    public-base-url: ${PLATFORM_PUBLIC_URL:http://127.0.0.1:8088}
    bootstrap-email: ${PLATFORM_BOOTSTRAP_EMAIL:}
    founder-email: ${PLATFORM_FOUNDER_EMAIL:nebdev07@gmail.com}
    default-password: ${PLATFORM_DEFAULT_PASSWORD:}
    magic-link-minutes: 15
    session-hours: 12
    mail-dev-capture: ${PLATFORM_MAIL_DEV_CAPTURE:false}
    cookie-secure: ${PLATFORM_COOKIE_SECURE:true}
  ssh:
    host: ${DEVOPS_SSH_HOST:}
    port: ${DEVOPS_SSH_PORT:22}
    user: ${DEVOPS_SSH_USER:}
    private-key-path: ${DEVOPS_SSH_KEY:}
    passphrase: ${DEVOPS_SSH_PASSPHRASE:}
    trust-unknown: ${DEVOPS_SSH_TRUST_UNKNOWN:false}
    timeout-seconds: 45

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
