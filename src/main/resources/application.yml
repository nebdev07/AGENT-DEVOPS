server.port: 8088

spring:
  config:
    import: optional:file:./state/agent-local.yml
  servlet:
    multipart:
      max-file-size: 4GB
      max-request-size: 8GB
      file-size-threshold: 1MB

devops:
  state-dir: ./state
  lab-fixture: classpath:fixtures/ubuntu-vps2-blank.txt
  ssh:
    host: ${DEVOPS_SSH_HOST:}
    port: ${DEVOPS_SSH_PORT:22}
    user: ${DEVOPS_SSH_USER:}
    private-key-path: ${DEVOPS_SSH_KEY:}
    passphrase: ${DEVOPS_SSH_PASSPHRASE:}
    trust-unknown: ${DEVOPS_SSH_TRUST_UNKNOWN:false}
    timeout-seconds: 45
