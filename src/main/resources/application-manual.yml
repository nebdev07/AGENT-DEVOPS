# Profil « manual » — tests manuels / démo (groupe saas-manual).
# Usage : SPRING_PROFILES_ACTIVE=saas-manual
# Runner séparé possible (AUTOPILOT_RUNNER_MODE=remote + clés), Swagger, MFA staff assouplie.
# Cibles privées autorisées pour viser un lab SSH ; ne jamais utiliser ce profil en production publique.

server.address: ${SERVER_ADDRESS:0.0.0.0}
server.port: ${SERVER_PORT:8080}

autopilot:
  public-url: ${AUTOPILOT_PUBLIC_URL:http://127.0.0.1:8080}
  auth:
    staff-mfa-required: false
  runner:
    mode: ${AUTOPILOT_RUNNER_MODE:embedded}
  servers:
    allow-private-targets: ${AUTOPILOT_ALLOW_PRIVATE_TARGETS:true}

springdoc:
  swagger-ui:
    enabled: true
