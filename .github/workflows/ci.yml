# Intégration continue : tests Java (PostgreSQL 16 embarqué, sans Docker), build Angular, build de l'image SaaS.
# Aucun secret requis, aucun déploiement.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests (unitaires, isolation multi-organisations, runner séparé, ArchUnit)
        run: mvn -B -ntp verify
      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng build --configuration production

  image:
    runs-on: ubuntu-24.04
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Image SaaS (construite, non publiée)
        run: docker build -f infrastructure/saas/Dockerfile -t vps-autopilot-saas:ci .
