# One-shot migration (dry-run / apply) — port local, pas de Traefik.
#   docker compose -f docker-compose.yml -f compose.migrate.yml --env-file .env up -d control-plane
# Ne pas combiner avec compose.prod.yml (réseaux/labels Traefik).
services:
  control-plane:
    ports:
      - "127.0.0.1:18080:8080"
    labels:
      - traefik.enable=false
    environment:
      AUTOPILOT_MIGRATION_PLATFORM_STATE_DIR: /migration/platform
      AUTOPILOT_MIGRATION_REPORT_FILE: /app/data/saas-import-report.json
    volumes:
      - ${AUTOPILOT_MIGRATION_HOST_DIR:-./migration}:/migration:ro
      - control-data:/app/data
  runner:
    profiles: ["never"]

volumes:
  control-data:
